name: DCsweden CodeQL (Java)

# DCsweden only, like dcsweden-image.yml: scans the code the clinic image is
# built from, with the same default queries FedLearnNet runs on their PRs.
# Lives on dcsweden/build only, so it stays out of the upstream pull
# request. Findings show under the repository's Security tab.
#
# It scans two branches: dcsweden/build (what we ship) and develop (the
# mirror of upstream, the repository's default branch, which the Security
# tab shows by default). A workflow only runs from the branch it lives on,
# so develop is checked out here and its results are uploaded under its
# own ref. CodeQL's default setup must stay off: GitHub rejects results
# from an advanced workflow while default setup is enabled.

on:
  push:
    branches: ["dcsweden/build"]
  workflow_dispatch:

concurrency:
  group: dcsweden-codeql
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: ["dcsweden/build", "develop"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Record the scanned commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # mvnw downloads its wrapper jar and Maven on first use; that download
      # sometimes fails on runners ("Could not find or load main class
      # org.apache.maven.wrapper.MavenWrapperMain"). Fetch it with retries.
      - name: Fetch the Maven wrapper
        run: |
          for i in 1 2 3; do
            bash mvnw -q -ntp --version && exit 0
            rm -f .mvn/wrapper/maven-wrapper.jar; rm -rf ~/.m2/wrapper; sleep 5
          done
          exit 1

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # A real build: build-mode none sees less of the code (it found
          # nothing where the build-based default setup found 12 alerts).
          build-mode: manual

      - name: Build
        run: bash mvnw -B -ntp compile -DskipTests

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
          ref: refs/heads/${{ matrix.branch }}
          sha: ${{ steps.head.outputs.sha }}
