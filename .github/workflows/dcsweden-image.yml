name: DCsweden image (Kubernetes backend)

# DCsweden only: this branch is k8s-backend-pr (the Kubernetes execution
# backend, proposed upstream) plus this one file. It builds the image the
# cosybio-k8s clinic chart runs, because docker.yml always pushes to
# ghcr.io/fedlearnnet/. Keep this file out of the upstream pull request.
#
# Updating: rebase k8s-backend-pr on upstream develop, then rebase this
# branch on k8s-backend-pr and push it.

on:
  push:
    branches: ["dcsweden/build"]
  workflow_dispatch:

concurrency:
  group: dcsweden-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dcsweden/orchestration-api/orch-api

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # mvnw downloads its wrapper jar and Maven on first use; that download
      # sometimes fails on runners ("Could not find or load main class
      # org.apache.maven.wrapper.MavenWrapperMain"). Fetch it with retries.
      - name: Fetch the Maven wrapper
        run: |
          for i in 1 2 3; do
            bash mvnw -q -ntp --version && exit 0
            rm -f .mvn/wrapper/maven-wrapper.jar; rm -rf ~/.m2/wrapper; sleep 5
          done
          exit 1

      # Unit tests that need no Docker (the Testcontainers ones skip or need a daemon)
      - name: Build and test the Kubernetes backend
        run: bash mvnw -B -ntp package -Dtest='K8sNamesTest,KubernetesExecutionServiceTest,KubernetesVolumeAdminServiceTest,DockerWireContractTest' -Dsurefire.failIfNoSpecifiedTests=false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          version=$(bash mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          short=${GITHUB_SHA::7}
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version-k8s" \
            -t "$IMAGE:k8s-backend" \
            -t "$IMAGE:k8s-backend-$short" \
            -f src/main/docker/Dockerfile.jvm \
            --push .
